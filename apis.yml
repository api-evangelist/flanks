aid: flanks
name: Flanks
description: >-
  Flanks is an AI-powered wealth data platform, headquartered in Barcelona with
  offices in Madrid, Paris, and London, that aggregates and standardizes
  investment and banking data from 700+ financial institutions into a single
  unified model. It serves financial advisors, banks, family offices, and asset
  managers through its Aggregate and Lume modules, processing millions of
  portfolios monthly across the EU. The Flanks API exposes an OAuth2-secured
  Connect flow (link accounts, resolve MFA/SCA challenges), plus Credentials,
  Entities, Aggregation, and Letters APIs that return portfolios, investments,
  accounts, liabilities, cards, and their transactions. A hosted Model Context
  Protocol (MCP) server gives AI assistants direct, OAuth-secured access to the
  same multi-bank investment data.
